<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>IT Community Forum</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-0000000000000000" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        .ad-placeholder { background: #f8fafc; border: 1px dashed #cbd5e1; display: flex; align-items: center; justify-content: center; min-height: 120px; color: #94a3b8; }
        .pt-safe { padding-top: env(safe-area-inset-top); }

    </style>
</head>
<body class="bg-slate-50 text-slate-900 pt-safe pb-safe">

    <!-- Mobile Header -->
    <div class="md:hidden glass p-4 flex justify-between items-center sticky top-0 z-50 border-b border-slate-200">
        <h1 class="text-xl font-bold text-blue-600"><i class="fas fa-laptop-code"></i> IT Forum</h1>
        <button id="mobile-menu-toggle" class="p-2 w-11 h-11 flex items-center justify-center text-slate-600"><i class="fas fa-bars text-xl"></i></button>
    </div>

    <!-- Container -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        
        <!-- Leaderboard Ad -->
        <div class="mb-8">
            <ins class="adsbygoogle ad-placeholder" style="display:block" data-ad-client="ca-pub-0000000000000000" data-ad-slot="1234567890" data-ad-format="horizontal"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-12 gap-8">
            
            <!-- Left Sidebar (Desktop) -->
            <aside class="hidden md:block md:col-span-3 lg:col-span-2">
                <nav class="sticky top-24 space-y-2">
                    <a href="#" class="block p-3 rounded-xl bg-blue-50 text-blue-700 font-semibold"><i class="fas fa-home w-6"></i> Home</a>
                    <a href="#" class="block p-3 rounded-xl hover:bg-slate-100 text-slate-600 font-medium"><i class="fas fa-tag w-6"></i> Categories</a>
                    <a href="#" class="block p-3 rounded-xl hover:bg-slate-100 text-slate-600 font-medium"><i class="fas fa-user w-6"></i> Profile</a>
                </nav>
            </aside>

            <!-- Center Feed -->
            <main class="md:col-span-9 lg:col-span-7 space-y-6">
                <div id="thread-feed" class="space-y-4">
                    <!-- Threads injected by JS -->
                </div>
            </main>

            <!-- Right Sidebar (Desktop) -->
            <aside class="hidden lg:block lg:col-span-3">
                <div class="sticky top-24 space-y-6">
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                        <h3 class="font-bold mb-4">Trending</h3>
                        <p class="text-sm text-slate-500">No trends available.</p>
                    </div>
                    <!-- Skyscraper Ad -->
                    <ins class="adsbygoogle ad-placeholder" style="display:block; min-height: 600px;" data-ad-client="ca-pub-0000000000000000" data-ad-slot="9998887776"></ins>
                    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
                </div>
            </aside>
        </div>
    </div>

    <!-- Auth Modal & Firebase Script omitted for brevity (unchanged logic) -->

        // Firebase Setup & Logic remains unchanged (imported/initialized as before)

</html>
