<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Tech Community Forum - Firebase</title>
    <!-- AdSense Head -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-0000000000000000" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .ad-placeholder { background-color: #f3f4f6; border: 2px dashed #d1d5db; display: flex; align-items: center; justify-content: center; min-height: 120px; color: #6b7280; font-weight: bold; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900">

    <!-- Navigation -->
    <nav class="bg-white shadow-sm p-4 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-600"><i class="fas fa-laptop-code"></i> IT Forum</h1>
            <div id="auth-container" class="flex items-center space-x-4">
                <!-- Auth buttons injected by JS -->
                <button id="login-btn" class="bg-blue-500 text-white px-3 py-1 rounded text-sm hover:bg-blue-600">Sign In with Google</button>
            </div>
        </div>
    </nav>

    <!-- Ad Banner -->
    <div class="container mx-auto mt-4">
        <ins class="adsbygoogle ad-placeholder" style="display:block" data-ad-client="ca-pub-0000000000000000" data-ad-slot="1234567890"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>

    <!-- Main Content -->
    <main class="container mx-auto mt-6 grid grid-cols-1 md:grid-cols-4 gap-6">
        <div class="md:col-span-3 space-y-6">
            <div id="thread-feed" class="space-y-4">
                <!-- Threads injected by JS -->
            </div>
            <!-- In-feed Ad -->
            <ins class="adsbygoogle ad-placeholder" style="display:block" data-ad-client="ca-pub-0000000000000000" data-ad-slot="0987654321"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>

        <aside class="space-y-4">
            <div class="bg-white p-4 rounded-lg shadow">
                <h3 class="font-bold mb-3 border-b pb-2">Categories</h3>
                <ul class="text-sm space-y-2 text-gray-600">
                    <li><i class="fas fa-mobile-alt w-5"></i> iPhone / iPad</li>
                    <li><i class="fas fa-laptop w-5"></i> PC / Mac</li>
                </ul>
            </div>
        </aside>
    </main>

    <!-- Auth Alert Modal -->
    <div id="auth-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-lg text-center w-80">
            <h3 class="text-lg font-bold mb-4 text-red-600">Access Denied</h3>
            <p class="text-sm text-gray-600 mb-4">Please log in to interact with the community.</p>
            <button onclick="document.getElementById('auth-modal').classList.add('hidden')" class="bg-gray-200 px-4 py-2 rounded text-sm">Close</button>
        </div>
    </div>

    <script type="module">
        // Firebase Setup
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;

        // Auth Logic
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const authContainer = document.getElementById('auth-container');
            if (user) {
                authContainer.innerHTML = `<img src="${user.photoURL}" class="w-10 h-10 rounded-full" /><span>${user.displayName}</span><button id="logout-btn" class="text-sm text-red-500">Sign Out</button>`;
                document.getElementById('logout-btn').onclick = () => signOut(auth);
            } else {
                authContainer.innerHTML = `<button id="login-btn" class="bg-blue-500 text-white px-3 py-1 rounded text-sm">Sign In</button>`;
                document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);
            }
            renderThreads();
        });

        // Database Logic
        async function renderThreads() {
            const feed = document.getElementById('thread-feed');
            feed.innerHTML = 'Loading threads...';
            const snapshot = await getDocs(collection(db, 'threads'));
            feed.innerHTML = '';
            snapshot.forEach(doc => {
                const thread = doc.data();
                const div = document.createElement('div');
                div.className = 'bg-white p-5 rounded-lg shadow';
                div.innerHTML = `
                    <h2 class="text-xl font-bold mb-2">${thread.title}</h2>
                    <p class="text-gray-700 mb-4">${thread.content}</p>
                    <div class="flex items-center space-x-6 text-gray-500 border-t pt-4">
                        <span><i class="fas fa-eye"></i> ${thread.viewCount}</span>
                        <button onclick="handleAction('like', '${doc.id}')" class="hover:text-blue-500"><i class="fas fa-thumbs-up"></i></button>
                    </div>
                `;
                feed.appendChild(div);
                incrementViewCount(doc.id);
            });
        }

        async function incrementViewCount(id) {
            await updateDoc(doc(db, 'threads', id), { viewCount: increment(1) });
        }

        window.handleAction = async (action, id) => {
            if (!currentUser) {
                document.getElementById('auth-modal').classList.remove('hidden');
                return;
            }
            alert(action + ' successful for thread ' + id);
            // Implement addLike/addEmoji using transaction here...
        }
    </script>
</body>
</html>
